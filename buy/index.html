<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Get Sorot Pro</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://sorot.app/">
<script src="/analytics.js?v=2"></script>
<noscript><meta http-equiv="refresh" content="0; url=https://buy.stripe.com/5kQbJ2gvtf590062Qj6Na01"></noscript>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;font:17px -apple-system,BlinkMacSystemFont,system-ui,sans-serif;background:#e6edf2;color:#17222d}a{color:#b37a22}</style>
</head>
<body>
<p>Taking you to checkout… <a id="go" href="https://buy.stripe.com/5kQbJ2gvtf590062Qj6Na01">Continue to Stripe</a></p>
<script>
  // Pass campaign tags on to the Stripe Payment Link, which records utm_* on the payment
  // (and client_reference_id / prefilled_email / prefilled_promo_code if given).
  // Nothing else from the address is forwarded.
  (() => {
    const link = new URL("https://buy.stripe.com/5kQbJ2gvtf590062Qj6Na01");
    const keep = ["utm_source", "utm_medium", "utm_campaign", "utm_content", "utm_term", "client_reference_id", "prefilled_email", "prefilled_promo_code", "locale"];
    const here = new URLSearchParams(location.search);
    for (const k of keep) {
      const v = here.get(k);
      if (v) link.searchParams.set(k, v.slice(0, 200));
    }
    // A promo code this browser was sent (see /price.js), e.g. KIRIMMACBOOK from "Send to my Mac".
    try {
      const saved = JSON.parse(localStorage.getItem("sorot-promo") || "null");
      if (saved && saved.until > Date.now() && /^[A-Z0-9]{3,30}$/.test(saved.code) && !link.searchParams.get("prefilled_promo_code")) {
        link.searchParams.set("prefilled_promo_code", saved.code);
      }
    } catch {}
    // The campaign (not the person) rides along as client_reference_id,
    // c__source__medium__campaign__content, so the license server can count the
    // purchase against the ad. Stripe allows letters, digits, dashes and underscores.
    const c = (window.sorotCampaign && window.sorotCampaign()) || {};
    const part = (v) => String(v || "").toLowerCase().replace(/[^a-z0-9-]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 45);
    if ((c.s || c.c) && !link.searchParams.get("client_reference_id")) {
      link.searchParams.set("client_reference_id", ["c", part(c.s), part(c.m), part(c.c), part(c.ct)].join("__"));
      for (const [k, v] of [["utm_source", c.s], ["utm_medium", c.m], ["utm_campaign", c.c], ["utm_content", c.ct]]) {
        if (v && !link.searchParams.get(k)) link.searchParams.set(k, String(v).slice(0, 200));
      }
    }
    window.sorotTrack && window.sorotTrack("checkout_start", { where: "buy_page" });
    document.getElementById("go").href = link.href;
    location.replace(link.href);
  })();
</script>
</body>
</html>
