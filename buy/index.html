<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Get Sorot Pro</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://sorot.app/">
<script src="/analytics.js?v=1"></script>
<noscript><meta http-equiv="refresh" content="0; url=https://buy.stripe.com/6oU8wQgvtaOT3cigH96Na00"></noscript>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;font:17px -apple-system,BlinkMacSystemFont,system-ui,sans-serif;background:#e6edf2;color:#17222d}a{color:#b37a22}</style>
</head>
<body>
<p>Taking you to checkout… <a id="go" href="https://buy.stripe.com/6oU8wQgvtaOT3cigH96Na00">Continue to Stripe</a></p>
<script>
  // Pass campaign tags on to the Stripe Payment Link, which records utm_* on the payment
  // (and client_reference_id / prefilled_email / prefilled_promo_code if given).
  // Nothing else from the address is forwarded.
  (() => {
    const link = new URL("https://buy.stripe.com/6oU8wQgvtaOT3cigH96Na00");
    const keep = ["utm_source", "utm_medium", "utm_campaign", "utm_content", "utm_term", "client_reference_id", "prefilled_email", "prefilled_promo_code", "locale"];
    const here = new URLSearchParams(location.search);
    for (const k of keep) {
      const v = here.get(k);
      if (v) link.searchParams.set(k, v.slice(0, 200));
    }
    // The Gelitik visitor id (first-party cookie) rides along as client_reference_id,
    // so the license server can credit the purchase to the campaign that brought them.
    const vid = (document.cookie.match(/(?:^|; )gelitik_vid=([^;]*)/) || [])[1];
    if (vid && /^[A-Za-z0-9_-]{8,64}$/.test(vid) && !link.searchParams.get("client_reference_id")) link.searchParams.set("client_reference_id", vid);
    // Count the checkout start (Gelitik's beacon format; site key from /analytics.js).
    try {
      const site = window.SOROT_GELITIK_SITE;
      if (vid && site && /^gk_[A-Za-z0-9]{16,40}$/.test(site) && navigator.globalPrivacyControl !== true) {
        const sid = (document.cookie.match(/(?:^|; )gelitik_sid=([^;]*)/) || [])[1] || vid;
        const body = JSON.stringify({ k: site, t: "checkout_start", u: location.href, r: document.referrer || null, v: vid, s: sid, p: { where: "buy_page" } });
        navigator.sendBeacon("https://gelitik.allrize.tech/e", new Blob([body], { type: "text/plain" }));
      }
    } catch {}
    document.getElementById("go").href = link.href;
    location.replace(link.href);
  })();
</script>
</body>
</html>
